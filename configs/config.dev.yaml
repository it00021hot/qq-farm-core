server:
  mode: 'dev'
  prefork: false
  bufferSize: 8192 # cookie缓冲区大小 默认是4096
  defaultPageSize: 10 # 默认分页条数
  maxPageSize: 500    # 最大分页条数
  whiteList: '*' # 白名单
  originList: '*' # cors地址列表以逗号相隔 默认* 按需配置如：https://example1.com,https://example2.com,
jwt:
  expire: 7200          # 兼容旧配置：access 默认秒数
  accessExpire: 7200    # access token 过期时间（秒）2h
  refreshExpire: 864000 # refresh token 过期时间（秒）10d
  issuer: 'qq-farm-core'                   #【需修改】
  secret: '3jQSRZXeXzr09hq0GrZuL9Dgtk2XV9Ax' #【需修改】
log:
  level: -4 # 日志级别 debug: -4, info: 0, warn: 4, error: 8
  fileName: 'qq-farm-core' # 日志文件名称  【需修改】
  dirPath: 'runtime/logs' # 日志默认存放目录
  maxSize: 1 # 日志最大存储大小 1M
  maxAge: 1 # 保留日志最大天数 1天
  maxBackups: 3 # 保留日志最大数量 3个
  localTime: true # 是否使用本地时间
  compress: true # 是否压缩归档日志
database:
  turso:
    enabled: true # Turso 嵌入式引擎（SQLite 兼容，单文件、无外部数据库；可直接读旧 .db）
    autoMigrate: true
    path: 'runtime/data/qq-farm.db'
    prefix: 'cn_'
    fileName: 'turso-sql'
    logLevel: 1 # 1:silent 2:error 3:warn 4:info
    maxIdleConn: 1
    maxOpenConn: 1
cache:
  prefix: 'qq_farm:' # 内存缓存 key 前缀（auth token 等，原 redis.prefix）
farm:
  gatewayUrl: 'wss://gate-obt.nqf.qq.com/prod/ws'
  wasmPath: 'resource/farm/tsdk.wasm'
  tsdkDataDir: 'runtime/tsdk'
  gameConfigDir: 'resource/farm/gameConfig'
  appId: 'wx5306c5978fdb76e4'
  tsdkGameId: 3167
  tsdkAppKey: '0'
  clientVersion: '1.14.0.4_20260911'
  os: 'Windows'
  pushWebhook: ''
  # QQ 官方机器人渠道（rust 语义：AccessToken + Gateway + C2C 单聊）
  qqBot:
    appId: ''
    clientSecret: ''
    userOpenid: ''
  # 钉钉群机器人渠道（支持加签）
  dingtalk:
    endpoint: ''
    token: ''
    secret: '' # Bark / 企业微信机器人等；账号异常时推送

wecom: # 企业微信
  corpId: ''  # 企业ID
  corpSecret: '' # 企业微信应用密钥
  agentId:  # 企业微信应用ID
  oauthCallback: '' # 企业微信回调地址
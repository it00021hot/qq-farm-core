server:
  mode: 'dev'
  prefork: false
  bufferSize: 8192 # cookie缓冲区大小 默认是4096
  defaultPageSize: 10 # 默认分页条数
  maxPageSize: 500    # 最大分页条数
  whiteList: '*' # 白名单
  originList: '*' # cors地址列表以逗号相隔 默认* 按需配置如：https://example1.com,https://example2.com,
swagger:
  enabled: true
  basePath: '/'
  filePath: './docs/swagger.json'
  path: 'docs'
  title: 'Go-skeleton API Docs'
jwt:
  expire: 7200          # 兼容旧配置：access 默认秒数
  accessExpire: 7200    # access token 过期时间（秒）2h
  refreshExpire: 864000 # refresh token 过期时间（秒）10d
  issuer: 'qq-farm-core'                   #【需修改】
  secret: '3jQSRZXeXzr09hq0GrZuL9Dgtk2XV9Ax' #【需修改】
log:
  level: -4 # 日志级别 debug: -4, info: 0, warn: 4, error: 8
  fileName: 'qq-farm-core' # 日志文件名称  【需修改】
  dirPath: 'runtime/logs' # 日志默认存放目录
  maxSize: 1 # 日志最大存储大小 1M
  maxAge: 1 # 保留日志最大天数 1天
  maxBackups: 3 # 保留日志最大数量 3个
  localTime: true # 是否使用本地时间
  compress: true # 是否压缩归档日志
database:
  sqlite:
    enabled: true # 使用 SQLite 单文件（无外部数据库）
    autoMigrate: true
    path: 'runtime/data/qq-farm.db'
    prefix: 'cn_'
    fileName: 'sqlite-sql'
    logLevel: 1 # 1:silent 2:error 3:warn 4:info
    maxIdleConn: 1
    maxOpenConn: 1
  pgsql:
    enabled: false # 已切 SQLite，保留段便于回退
    autoMigrate: false
    maxIdleConn: 10
    maxOpenConn: 100
    maxLifeTime: 60
    maxIdleTime: 0
    sources:
      default:
        separation: false
        fileName: 'default-sql'
        logLevel: 1
        prefix: "cn_"
        master: 'host=127.0.0.1 user=postgres password= password dbname=go_skeleton port=5432 sslmode=disable TimeZone=Asia/Shanghai'
        slave: []
  mongo:
    enable: false
    uri:
    minPoolSize: 10
    maxPoolSize: 20
redis:
  enabled: false # 不使用 Redis；JWT/权限缓存走进程内 memcache
  host: '127.0.0.1'
  port: '6379'
  password: ''
  dbNum: 0
  prefix: 'qq_farm:' # 内存 key 前缀（兼容旧 redis 包 API）
  poolSize: 0
  maxIdleConn: 0
  minIdleConn: 0
  maxIdleTime: 0
  maxLifeTime: 0
amqp:
  enabled: false
  host: '127.0.0.1'
  port: '5672'
  user: 'guest'
  password: ''
  vhost: ''
farm:
  gatewayUrl: 'wss://gate-obt.nqf.qq.com/prod/ws'
  wasmPath: 'resource/farm/tsdk.wasm'
  tsdkDataDir: 'runtime/tsdk'
  gameConfigDir: 'resource/farm/gameConfig'
  appId: 'wx5306c5978fdb76e4'
  tsdkGameId: 3167
  tsdkAppKey: '0'
  clientVersion: '1.13.2.8_20260723'
  os: 'Windows'
  pushWebhook: '' # Bark / 企业微信机器人等；账号异常时推送

wecom: # 企业微信
  corpId: ''  # 企业ID
  corpSecret: '' # 企业微信应用密钥
  agentId:  # 企业微信应用ID
  oauthCallback: '' # 企业微信回调地址
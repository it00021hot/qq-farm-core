server:
  mode: 'production'
  prefork: false
  bufferSize: 8192 # cookie缓冲区大小 默认是4096
  defaultPageSize: 10 # 默认分页条数
  maxPageSize: 500    # 最大分页条数
  fileUploadPath: 'upload' # 文件上传路径
  fileHostUrl: 'http://127.0.0.1:9527/' # 文件访问域名
  whiteList: '*' # 白名单
  originList: '*' # cors地址列表以逗号相隔 默认* 按需配置如：https://example1.com,https://example2.com,
  uploadType: 2 # 上传类型 1:阿里云OSS 2:S3兼容
  signExpireSeconds: 3600 # 私有对象预签名 GET 有效秒数
swagger:
  enabled: true
  basePath: '/'
  filePath: './docs/swagger.json'
  path: 'docs'
  title: 'Go-skeleton API Docs'
jwt:
  expire: 864000   # token过期时间 单位：s
  issuer: 'go-skeleton'
  secret: '3jQSRZXeXzr09hq0GrZuL9Dgtk2XV9Ax'
log:
  level: -4 # 日志级别 debug: -4, info: 0, warn: 4, error: 8
  fileName: 'go-skeleton' # 日志文件名称
  dirPath: 'runtime/logs' # 日志默认存放目录
  maxSize: 100 # 日志最大存储大小 1M
  maxAge: 30 # 保留日志最大天数 1天
  maxBackups: 7 # 保留日志最大数量 3个
  localTime: true # 是否使用本地时间
  compress: true # 是否压缩归档日志
database:
  pgsql:
    enabled: true # 是否启用pgsql
    autoMigrate: true # 启动时 AutoMigrate + 初始化数据
    maxIdleConn: 10 # 设置空闲连接池中连接的最大数量
    maxOpenConn: 100 # 设置打开数据库连接的最大数量
    maxLifeTime: 60 # 设置连接可复用的最大时间（分钟）
    maxIdleTime: 0 # 设置连接池中保持空闲的最长时间（秒）默认是0 意味着连接池中的连接将保持打开状态
    sources: # 数据库配置 需要配置多个数据库 复制default以下模板
      default: # 默认数据库 (此名称切勿修改)
        separation: false # 配置是否使用读写分离，方便改配置切换
        fileName: 'default-sql' # 日志文件名称 【需修改】
        logLevel: 1 # 日志模式 1:slient 2:error 3:warn 4:info
        prefix: "cn_" # casbin adapter 等组件使用的表前缀（model.TableName 已含完整表名）
        master: 'host=192.168.1.52 user=postgres password=pBcYkeB9g08DWWJ3Evmq dbname=go_skeleton port=5432 sslmode=disable TimeZone=Asia/Shanghai' # 主库链接地址
        slave:
          - 'host=192.168.1.52 user=postgres password=pBcYkeB9g08DWWJ3Evmq dbname=go_skeleton port=5432 sslmode=disable TimeZone=Asia/Shanghai' # 从库链接地址
  mongo:
    enable: false
    uri:
    minPoolSize: 10
    maxPoolSize: 20
redis:
  enabled: true # 是否启用redis
  host: '192.168.1.52'
  port: '6379'
  password: '111111'
  dbNum: 3
  prefix: 'finance:' # 登录用户存入redis键名的前缀
  poolSize: 20
  maxIdleConn: 30
  minIdleConn: 10
  maxIdleTime: 30   # 单位（分）
  maxLifeTime: 60   # 单位（秒）
amqp:
  enabled: true # 是否启用rabbitmq
  host: '127.0.0.1'
  port: '5672'
  user: 'guest'
  password: ''
  vhost: ''
oss:
  endPoint: 'oss-cn-shenzhen.aliyuncs.com'
  accessKeyId: ''
  accessKeySecret: ''
  bucketName: 'huahao-crm'
s3:
  endPoint: '192.168.1.52:9000'
  useSSL: false
  accessKeyId: 'rustfsadmin'
  accessKeySecret: 'rustfsadmin'
  bucketName: 'go-skeleton'
  baseUrl: 'http://192.168.1.52:9000/go-skeleton'
  region: 'us-east-1'
wecom: # 企业微信
  corpId: ''  # 企业ID
  corpSecret: '' # 企业微信应用密钥
  agentId:  # 企业微信应用ID
  oauthCallback: '' # 企业微信回调地址
server:
  mode: 'production'
  prefork: false
  bufferSize: 8192
  defaultPageSize: 10
  maxPageSize: 500
  fileUploadPath: 'upload'
  fileHostUrl: 'http://127.0.0.1:9527/'
  whiteList: '*'
  originList: '*'
  uploadType: 0
  signExpireSeconds: 3600
  superRoleId: '1'
swagger:
  enabled: true
  basePath: '/'
  filePath: './docs/swagger.json'
  path: 'docs'
  title: 'Go-skeleton API Docs'
jwt:
  expire: 7200
  accessExpire: 7200
  refreshExpire: 864000
  issuer: 'go-skeleton'
  secret: '3jQSRZXeXzr09hq0GrZuL9Dgtk2XV9Ax'
log:
  level: 0
  fileName: 'go-skeleton'
  dirPath: 'runtime/logs'
  maxSize: 100
  maxAge: 30
  maxBackups: 7
  localTime: true
  compress: true
database:
  sqlite:
    enabled: true
    autoMigrate: true
    path: 'runtime/data/qq-farm.db'
    prefix: 'cn_'
    fileName: 'sqlite-sql'
    logLevel: 2
    maxIdleConn: 1
    maxOpenConn: 1
  pgsql:
    enabled: false
    autoMigrate: false
    maxIdleConn: 10
    maxOpenConn: 100
    maxLifeTime: 60
    maxIdleTime: 0
    sources:
      default:
        separation: false
        fileName: 'default-sql'
        logLevel: 1
        prefix: "cn_"
        master: 'host=127.0.0.1 user=postgres password= password dbname=go_skeleton port=5432 sslmode=disable TimeZone=Asia/Shanghai'
        slave: []
  mongo:
    enable: false
    uri:
    minPoolSize: 10
    maxPoolSize: 20
redis:
  enabled: false
  host: '127.0.0.1'
  port: '6379'
  password: ''
  dbNum: 0
  prefix: 'qq_farm:'
  poolSize: 0
  maxIdleConn: 0
  minIdleConn: 0
  maxIdleTime: 0
  maxLifeTime: 0
amqp:
  enabled: false
  host: '127.0.0.1'
  port: '5672'
  user: 'guest'
  password: ''
  vhost: ''
farm:
  gatewayUrl: 'wss://gate-obt.nqf.qq.com/prod/ws'
  wasmPath: 'resource/farm/tsdk.wasm'
  tsdkDataDir: 'runtime/tsdk'
  gameConfigDir: 'resource/farm/gameConfig'
  appId: 'wx5306c5978fdb76e4'
  tsdkGameId: 3167
  tsdkAppKey: '0'
  pushWebhook: ''
oss:
  endPoint: 'oss-cn-shenzhen.aliyuncs.com'
  accessKeyId: ''
  accessKeySecret: ''
  bucketName: 'huahao-base'
s3:
  endPoint: '127.0.0.1:9000'
  useSSL: false
  accessKeyId: ''
  accessKeySecret: ''
  bucketName: 'go-skeleton'
  baseUrl: ''
  region: 'us-east-1'
wecom:
  corpId: ''
  corpSecret: ''
  agentId:
  oauthCallback: ''

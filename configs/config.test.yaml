server:
  mode: 'test'
  prefork: false
  bufferSize: 8192
  defaultPageSize: 10
  maxPageSize: 500
  whiteList: '*'
  originList: '*'
jwt:
  expire: 7200
  accessExpire: 7200
  refreshExpire: 864000
  issuer: 'qq-farm-core'
  secret: '3jQSRZXeXzr09hq0GrZuL9Dgtk2XV9Ax'
log:
  level: -4
  fileName: 'qq-farm-core'
  dirPath: 'runtime/logs'
  maxSize: 1
  maxAge: 1
  maxBackups: 3

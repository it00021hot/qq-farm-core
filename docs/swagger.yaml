      consumes:
      - application/json
      description: 在当前租户上下文创建用户并分配角色（不高于操作者）。平台用户必须传 X-Tenant-ID
      parameters:
      - description: 平台用户操作目标租户ID
        in: header
        name: X-Tenant-ID
        type: string
      - description: 创建参数
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/github_com_MQEnergy_go-skeleton_internal_app_controller_system_admin.CreateReq'

        "400":
          description: 请求错误
          schema:
            $ref: '#/definitions/response.JSONResponse'
        "403":
          description: 无权限
          schema:
            $ref: '#/definitions/response.JSONResponse'
      security:
      - ApiKeyAuth: []
      summary: 更新租户用户
      tags:
      - 用户管理
